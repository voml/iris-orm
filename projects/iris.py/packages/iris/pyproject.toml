[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "iris"
description = "Iris ORM Python binding (memory, sqlite, yydb, postgres and mysql sessions)"
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[tool.maturin]
manifest-path = "../../../../projects/iris.rs/iris-pyo3/Cargo.toml"
module-name = "iris_pyo3"
python-source = "src"
python-packages = ["iris"]
exclude = ["**/__pycache__/**", "**/*.pyc", "dist/**"]
