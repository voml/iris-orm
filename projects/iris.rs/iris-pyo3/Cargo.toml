[package]
name = "iris-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python (pyo3) binding skeleton for Iris ORM"
publish = false

[lib]
name = "iris_pyo3"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
# `generator-aot` is the facade feature that embeds the Dejavu template
# registry, so `iris::generator` can render every host family at runtime.
iris = { workspace = true, features = ["pyo3", "generator-aot"] }
pyo3 = { workspace = true }
serde_json = { workspace = true }
