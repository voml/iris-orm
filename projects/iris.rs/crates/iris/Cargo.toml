[package]
name = "iris"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Iris ORM -- public Rust facade for VOS data access"
readme = "../../../readme.md"
publish = false

[dependencies]
iris-types = { workspace = true }
iris-ir = { workspace = true }
iris-adapter-mysql = { workspace = true, optional = true }
iris-adapter-postgres = { workspace = true, optional = true }
iris-adapter-sqlite = { workspace = true, optional = true }
von = { workspace = true }

[features]
default = []
migrate = ["dep:iris-adapter-mysql", "dep:iris-adapter-postgres", "dep:iris-adapter-sqlite"]

[dev-dependencies]
