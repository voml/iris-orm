[package]
name = "iris-generator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Iris GenerationModel + Dejavu-backed emitters"
publish = false

[features]
default = ["aot", "templates-host"]
# Parse every enabled `.dejavu` template into the registry that is embedded
# into each host binary.
aot = []
# Every family a native host can render (`iris-host`, `iris-pyo3`, `iris-napi`).
templates-host = ["templates-typescript", "templates-python", "templates-rust"]
# Template families. Each one adds its own `.dejavu` files to the AOT registry.
# `iris-wasm` turns off the families it cannot render so the browser artifact
# does not carry their IR payload.
templates-typescript = []
templates-python = []
templates-rust = []

[dependencies]
vos = { workspace = true }
dejavu = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
dejavu = { workspace = true }
serde_json = { workspace = true }
