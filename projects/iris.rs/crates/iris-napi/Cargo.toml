[package]
name = "iris-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "N-API binding for Iris ORM (Node semantic core)"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# FIXME: sqlite adapter temporarily gated — `sqlite-provider-rusqlite` no longer exists on yyds dev
sqlite = []

[dependencies]
iris = { workspace = true, features = ["migrate"] }
iris-generator = { workspace = true }
iris-wasm = { workspace = true }
# iris-adapter-sqlite = { workspace = true, optional = true }  # FIXME: upstream crate removed
iris-adapter-postgres = { workspace = true }
iris-adapter-mysql = { workspace = true }
iris-connector-yydb = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
