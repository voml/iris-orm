[workspace]
resolver = "2"
members = ["projects/iris.rs/crates/*"]
exclude = ["projects/iris.rs/crates/iris-adapter-sqlite"]  # FIXME: sqlite-provider-rusqlite removed upstream
default-members = [
    "projects/iris.rs/crates/iris",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/voml/iris-orm"
homepage = "https://iris-orm.pages.dev/"

[workspace.dependencies]
# Public VOS/VON/YYDB — git `dev` only (CI / Docker; no sibling path checkouts).
vos = { git = "https://github.com/voml/vos-language.git", branch = "dev" }
von = { git = "https://github.com/voml/von-language.git", branch = "dev", features = ["serde"] }
yydb = { git = "https://github.com/yy-database/yydb.rs.git", branch = "dev" }
dejavu = { git = "https://github.com/doki-land/dejavu-engine.git", branch = "dev" }

once_cell = "1"
clap = { version = "4", features = ["derive"] }
# sqlite-provider = { git = "https://github.com/yy-database/yyds.git", branch = "dev" }  # FIXME: no longer consumed (iris-adapter-sqlite excluded from workspace)
# sqlite-provider-rusqlite = { git = "https://github.com/yy-database/yyds.git", branch = "dev" }  # FIXME: crate no longer exists on yyds dev
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
mysql = "25"
redis = "0.27"
blake3 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"

iris = { path = "projects/iris.rs/crates/iris" }
iris-types = { path = "projects/iris.rs/crates/iris-types" }
iris-ir = { path = "projects/iris.rs/crates/iris-ir" }
iris-generator = { path = "projects/iris.rs/crates/iris-generator" }
iris-wasm = { path = "projects/iris.rs/crates/iris-wasm" }
iris-connector-yydb = { path = "projects/iris.rs/crates/iris-connector-yydb" }
iris-connector-yyds = { path = "projects/iris.rs/crates/iris-connector-yyds" }
iris-adapter-mysql = { path = "projects/iris.rs/crates/iris-adapter-mysql" }
iris-adapter-postgres = { path = "projects/iris.rs/crates/iris-adapter-postgres" }
# iris-adapter-sqlite = { path = "projects/iris.rs/crates/iris-adapter-sqlite" }  # FIXME: sqlite-provider-rusqlite removed upstream
iris-adapter-redis = { path = "projects/iris.rs/crates/iris-adapter-redis" }
napi = { version = "3.12", default-features = false, features = ["napi9"] }
napi-derive = "3.6"
napi-build = "2"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
