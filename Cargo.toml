[workspace]
resolver = "2"
members = [
    "projects/iris.rs/iris-napi",
    "projects/iris.rs/iris-pyo3",
]
default-members = [
    "projects/iris.rs/iris-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/voml/iris-orm"
homepage = "https://iris-orm.pages.dev/"

[workspace.dependencies]
# Sole database dependency · the `iris` facade. Pin full 40-char rev.
# Local absolute path overrides belong in `.cargo/config.toml` (facade only).
iris = { git = "https://github.com/oovm/boost.rs.git", rev = "ee57adaa0ce12039ad22a80cfee2f4b6cd504ead" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
napi = { version = "3.12", default-features = false, features = ["napi9"] }
napi-derive = "3.6"
napi-build = "2"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
