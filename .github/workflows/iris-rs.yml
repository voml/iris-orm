name: iris.rs

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths:
      - "projects/iris.rs/**"
      - ".github/workflows/iris-rs.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "projects/iris.rs/**"
      - ".github/workflows/iris-rs.yml"

defaults:
  run:
    working-directory: projects/iris.rs

env:
  CARGO_TERM_COLOR: always
  IRIS_TEST_POSTGRES_URL: host=127.0.0.1 user=iris password=iris dbname=iris
  IRIS_TEST_MYSQL_URL: mysql://iris:iris@127.0.0.1:3306/iris
  IRIS_TEST_REDIS_URL: redis://127.0.0.1:6379/

jobs:
  check:
    name: fmt · check · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: iris
          MYSQL_DATABASE: iris
          MYSQL_USER: iris
          MYSQL_PASSWORD: iris
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/iris.rs -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy (Iris crates only; path deps keep capped lints)
        run: >
          cargo clippy
          -p iris -p iris-types -p iris-ir -p iris-generator -p iris-tools
          -p iris-connector-yydb -p iris-connector-yyds
          -p iris-adapter-mysql -p iris-adapter-postgres
          -p iris-adapter-sqlite -p iris-adapter-redis
          --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
