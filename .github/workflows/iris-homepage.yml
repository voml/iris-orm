name: iris-homepage

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths:
      - "projects/iris.ts/homepage/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/iris-homepage.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "projects/iris.ts/homepage/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/iris-homepage.yml"

defaults:
  run:
    working-directory: projects/iris.ts/homepage

jobs:
  vmz:
    name: check · build · documents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/iris.ts/homepage/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: vmz check
        run: pnpm check

      - name: vmz build (dist/cdn)
        run: pnpm build

      - name: document check
        run: pnpm document:check

      - name: verify browser export map
        run: pnpm run verify:hosts
