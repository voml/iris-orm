name: iris-python

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
    paths:
      - "projects/iris.py/**"
      - "projects/iris.rs/crates/iris-pyo3/**"
      - "Cargo.toml"
      - ".github/workflows/check-python.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "projects/iris.py/**"
      - "projects/iris.rs/crates/iris-pyo3/**"
      - "Cargo.toml"
      - ".github/workflows/check-python.yml"

defaults:
  run:
    working-directory: .

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: pyo3 · maturin · unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .venv-python/bin/python
          - os: windows-latest
            venv-python: .venv-python/Scripts/python.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install maturin
        run: python -m pip install --disable-pip-version-check "maturin>=1.9.4,<2"

      - name: Pin the pyo3 interpreter
        run: echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt -p iris-pyo3 -- --check

      - name: Check
        run: cargo check -p iris-pyo3

      - name: Rust tests
        run: cargo test -p iris-pyo3

      - name: Build wheel
        working-directory: projects/iris.py/packages/iris
        run: maturin build --manifest-path ../../../../projects/iris.rs/crates/iris-pyo3/Cargo.toml --out dist/python

      - name: Create the test environment
        run: python -m venv .venv-python

      - name: Install the wheel
        run: ${{ matrix.venv-python }} -m pip install --disable-pip-version-check --no-index --find-links projects/iris.py/packages/iris/dist/python iris

      - name: Python tests
        run: ${{ matrix.venv-python }} -m unittest discover -s projects/iris.py/packages/iris/tests -v

      - name: Example smoke
        run: ${{ matrix.venv-python }} projects/iris.py/packages/iris/examples/embedded/main.py
