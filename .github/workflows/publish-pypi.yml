# Trusted Publisher contract (sole PyPI trusted workflow — keep this filename):
#   file = publish-pypi.yml
#   repo = voml/iris-orm
#   env  = PYPI_PUBLISH
#
# Trigger: push tag v* only. There is no `workflow_dispatch`: a real PyPI
# release must be reproducible from a tag, and a manual entry point invites a
# version that no tag ever recorded.
#
# Do not register a Trusted Publisher on any other workflow file, and do not
# publish from a workstation (`maturin publish` / `twine upload`).

name: Publish PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build-wheel:
    name: wheel ${{ matrix.python }} · ${{ matrix.short }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short: manylinux-x64
          - os: windows-latest
            short: win32-x64
          - os: macos-latest
            short: darwin-arm64
          - os: macos-15-intel
            short: darwin-x64
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install maturin
        run: python -m pip install --disable-pip-version-check "maturin>=1.9.4,<2"

      - name: Pin the pyo3 interpreter
        run: echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # `pyproject.toml` owns `manifest-path`, `module-name` and `python-source`.
      # Passing `--manifest-path` makes maturin ignore it and emit an `iris_pyo3`
      # wheel that `pip install iris` cannot resolve.
      - name: Build wheel
        working-directory: projects/iris.py/packages/iris
        run: maturin build --out dist/python

      - name: Install the wheel
        run: python -m pip install --disable-pip-version-check --no-index --find-links projects/iris.py/packages/iris/dist/python iris

      - name: Python tests
        run: python -m unittest discover -s projects/iris.py/packages/iris/tests -v

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.short }}-${{ matrix.python }}
          path: projects/iris.py/packages/iris/dist/python/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheel]
    runs-on: ubuntu-latest
    environment: PYPI_PUBLISH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/pypi
          merge-multiple: true

      - name: Check the tag matches the built version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          if [[ -z "$version" || "$version" == *"/"* ]]; then
            echo "could not parse a version from GITHUB_REF=$GITHUB_REF" >&2
            exit 1
          fi
          mismatch=0
          for wheel in dist/pypi/*.whl; do
            name="$(basename "$wheel")"
            if [[ "$name" != "iris-${version}-"* ]]; then
              echo "$name does not match tag $tag" >&2
              mismatch=1
            fi
          done
          if [[ "$mismatch" -ne 0 ]]; then
            exit 1
          fi
          find dist/pypi -name '*.whl' -print

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          print-hash: true
