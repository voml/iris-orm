# Copy to `config.toml` (git ignored) and replace `<your-path>` with your local absolute path.
# CI / publish: no `config.toml` — root `Cargo.toml` git `dev` only.

[patch."https://github.com/voml/vos-language.git"]
vos = { path = "<your-path>/vos-language/projects/crates/vos" }

[patch."https://github.com/yy-database/yydb.rs.git"]
yydb = { path = "<your-path>/yydb/projects/crates/yydb" }
